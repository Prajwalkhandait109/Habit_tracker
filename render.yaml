services:
  - type: web
    name: winter-arc-tracker
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: winter-arc-db
          property: connectionString

databases:
  - name: winter-arc-db
    plan: free
