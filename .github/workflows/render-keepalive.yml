name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check app health
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://winter-arc-tracker.onrender.com/api/health' }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --max-time 30 \
            "$HEALTH_URL"
          printf '\n'
